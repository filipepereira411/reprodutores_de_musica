<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Meu Reprodutor de Música</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #1DB954; /* Verde clássico do Spotify */
            margin-bottom: 30px;
        }

        .player-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }

        .player-box {
            flex: 1;
            min-width: 300px;
            max-width: 480px;
            background-color: #181818;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .player-box h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #282828;
            padding-bottom: 8px;
        }

        .soundcloud-title {
            color: #ff5500; /* Laranja clássico do SoundCloud */
        }

        .spotify-title {
            color: #1DB954;
        }

        iframe {
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Os Meus Reprodutores de Áudio</h1>

    <div class="player-container">

        <!-- BLOCO DO SOUNDCLOUD -->
        <div class="player-box">
            <h2 class="soundcloud-title">SoundCloud</h2>
            <!-- Substitua o link em src pelo link da música ou artista que preferir -->
            <iframe 
                width="100%" 
                height="300" 
                scrolling="no" 
                allow="autoplay" 
                src="https://soundcloud.com">
            </iframe>
        </div>

        <!-- BLOCO DO SPOTIFY -->
        <div class="player-box">
            <h2 class="spotify-title">Spotify</h2>
            <!-- Substitua o ID da faixa/playlist no link do src se quiser mudar de música -->
            <iframe 
                src="https://spotify.com" 
                width="100%" 
                height="300" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
            </iframe>
        </div>

    </div>

</body>
</html>
